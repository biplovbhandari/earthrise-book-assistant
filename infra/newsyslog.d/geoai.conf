# Geo-AI Book Assistant - log rotation
# Install: sudo cp infra/newsyslog.d/geoai.conf /etc/newsyslog.d/
#
# Rotates daily ($D0), keeps 7 copies, compresses old files (J = bzip2).
# Paths use REPO_PATH placeholder -- replace with actual path before installing.
#
# app.log is rotated by Python's RotatingFileHandler (not newsyslog).
# These entries cover raw process output and the Cloudflare tunnel.

REPO_PATH/logs/app/stdout.log              644  7  *  $D0  J
REPO_PATH/logs/app/stderr.log              644  7  *  $D0  J
REPO_PATH/logs/tunnel/tunnel.log           644  7  *  $D0  J
REPO_PATH/logs/tunnel/tunnel.error.log     644  7  *  $D0  J
