name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - run: uv sync --frozen --group dev

      - name: Lint and format check
        run: just lint

      - name: Type check
        run: just typecheck

      - name: Tests
        run: just test
