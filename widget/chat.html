<div id="geoai-chat-widget">

<button id="geoai-chat-toggle" aria-label="Open chat assistant">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
  </svg>
</button>

<div id="geoai-chat-panel" role="dialog" aria-label="Chat assistant" inert aria-hidden="true">
  <header>
    <h2>Geo-AI Book Assistant</h2>
    <span class="geoai-chat-header-actions">
      <button id="geoai-chat-new" aria-label="New conversation">New chat</button>
      <button id="geoai-chat-close" aria-label="Close chat">&times;</button>
    </span>
  </header>
  <div id="geoai-chat-suggestions"></div>
  <div id="geoai-chat-messages" role="log"></div>
  <div id="geoai-chat-status" aria-live="polite"></div>
  <form id="geoai-chat-form">
    <textarea placeholder="Ask about the book..." rows="1" aria-label="Your message"></textarea>
    <button type="submit">Send</button>
  </form>
  <p id="geoai-chat-disclaimer">AI-generated content may be inaccurate. Verify with the book.</p>
</div>

</div>
