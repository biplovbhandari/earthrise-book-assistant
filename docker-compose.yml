name: geoai-book-assistant

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.app
    profiles: ["gpu"]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://geoai:geoai@postgres:5432/geoai
    volumes:
      - models_cache:/models
      - book_html:/app/_book:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    logging: *default-logging
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./.data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: geoai-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: geoai
      POSTGRES_PASSWORD: geoai
      POSTGRES_DB: geoai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoai -d geoai"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  quarto-builder:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.quarto
    profiles: ["build"]
    volumes:
      - ./book:/book:ro
      - ./widget:/widget:ro
      - book_html:/output
    logging: *default-logging

  book-copy:
    image: alpine:3
    profiles: ["build"]
    volumes:
      - book_html:/src:ro
      - ./_book:/dst
    command: sh -c 'cp -a /src/. /dst/'
    logging: *default-logging

  indexer:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.indexer
    profiles: ["build"]
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - BOOK_SOURCE_DIR=/book
      - BOOK_COMMIT_SHA=${BOOK_COMMIT_SHA:-unknown}
      - WHISPER_CACHE_DIR=/models/whisper
    volumes:
      - ./book:/book:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - models_cache:/models
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: geoai-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - .data/prometheus:/prometheus
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "$$ADMIN_TOKEN" > /tmp/admin_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=30d
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: geoai-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - .data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    logging: *default-logging
    restart: unless-stopped

volumes:
  models_cache:
  book_html:
