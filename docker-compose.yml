services:
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.app
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - DATABASE_URL=postgresql+asyncpg://earthrise:earthrise@postgres:5432/earthrise
    volumes:
      - models_cache:/models
      - book_html:/app/_book:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./.data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: earthrise-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: earthrise
      POSTGRES_PASSWORD: earthrise
      POSTGRES_DB: earthrise
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthrise -d earthrise"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  quarto-builder:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.quarto
    profiles: ["build"]
    volumes:
      - ./book:/book:ro
      - ./widget:/widget:ro
      - book_html:/output

  book-copy:
    image: alpine:3
    profiles: ["build"]
    volumes:
      - book_html:/src:ro
      - ./_book:/dst
    command: sh -c 'cp -a /src/. /dst/'

  indexer:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.indexer
    profiles: ["build"]
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - BOOK_SOURCE_DIR=/book
      - BOOK_COMMIT_SHA=${BOOK_COMMIT_SHA:-unknown}
      - WHISPER_CACHE_DIR=/models/whisper
    volumes:
      - ./book:/book:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - models_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

volumes:
  models_cache:
  book_html:
